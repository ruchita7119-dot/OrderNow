spring.application.name=apigateway

server.port=8080

# =========================
# User Service
# =========================
spring.cloud.gateway.server.webflux.routes[0].id=userservice
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/users/**

# =========================
# Authentication Service
# =========================
spring.cloud.gateway.server.webflux.routes[1].id=authservice
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/auth/**

# =========================
# Hotel Service
# =========================
spring.cloud.gateway.server.webflux.routes[2].id=hotelservice
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/hotels/**

# =========================
# Order Service
# =========================
spring.cloud.gateway.server.webflux.routes[3].id=orderservice
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/orders/**

# =========================
# Payment Service
# =========================
spring.cloud.gateway.server.webflux.routes[4].id=paymentservice
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/payments/**

# =========================
# JWT Configuration
# =========================
jwt.secret=${JWT_SECRET}

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================
# CORS Configuration
# =========================
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true

# Handle CORS preflight
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
