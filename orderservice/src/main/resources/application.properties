
spring.application.name=orderservice

server.port=8083

# ===============================
# MySQL Configuration
# ===============================
spring.datasource.url=${ORDER_DB_URL:jdbc:mysql://localhost:3306/ordernow_order_service}

spring.application.name=orderservice

server.port=8083

# ===============================
# MySQL Configuration
# ===============================
spring.datasource.url=${ORDER_DB_URL:jdbc:mysql://localhost:3306/ordernow_order_service}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

# ===============================
# JPA Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Redis Configuration
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ===============================
# Swagger
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===============================
# OpenFeign
# ===============================
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# ===============================
# Service URLs
# ===============================
user.service.url=${USER_SERVICE_URL:http://localhost:8081}
hotel.service.url=${HOTEL_SERVICE_URL:http://localhost:8082}

# ===============================
# Internal Service Authentication
# ===============================
internal.service.secret=${INTERNAL_SERVICE_SECRET}

