
services:

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7
    container_name: ordernow-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # =========================
  # User Service
  # =========================
  userservice:
    image: ordernow-user-service:1.0
    container_name: ordernow-user-container
    ports:
      - "8081:8081"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    restart: unless-stopped

  # =========================
  # Hotel Service
  # =========================
  hotelservice:
    image: ordernow-hotelservice:1.0
    container_name: ordernow-hotel-container
    ports:
      - "8082:8082"
    environment:
      HOTEL_DB_URL: ${HOTEL_DB_URL}
      HOTEL_DB_USERNAME: ${MYSQL_USERNAME}
      HOTEL_DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    restart: unless-stopped

  # =========================
  # Order Service
  # =========================
  orderservice:
    image: ordernow-orderservice:1.0
    container_name: ordernow-order-container
    ports:
      - "8083:8083"
    environment:
      ORDER_DB_URL: ${ORDER_DB_URL}
      ORDER_DB_USERNAME: ${MYSQL_USERNAME}
      ORDER_DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://userservice:8081
      HOTEL_SERVICE_URL: http://hotelservice:8082
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    depends_on:
      - redis
      - userservice
      - hotelservice
    restart: unless-stopped

  # =========================
  # Payment Service
  # =========================
  paymentservice:
    image: ordernow-paymentservice:1.0
    container_name: ordernow-payment-container
    ports:
      - "8084:8084"
    environment:
      PAYMENT_DB_URL: ${PAYMENT_DB_URL}
      PAYMENT_DB_USERNAME: ${MYSQL_USERNAME}
      PAYMENT_DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ORDER_SERVICE_URL: http://orderservice:8083
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    depends_on:
      - redis
      - orderservice
    restart: unless-stopped

  # =========================
  # API Gateway
  # =========================
  apigateway:
    image: ordernow-apigateway:1.0
    container_name: ordernow-gateway-container
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://userservice:8081
      HOTEL_SERVICE_URL: http://hotelservice:8082
      ORDER_SERVICE_URL: http://orderservice:8083
      PAYMENT_SERVICE_URL: http://paymentservice:8084
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - userservice
      - hotelservice
      - orderservice
      - paymentservice
    restart: unless-stopped
