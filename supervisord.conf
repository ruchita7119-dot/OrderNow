
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no
autostart=true
autorestart=true
priority=10
startsecs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:user]
command=/bin/bash /app/start-services.sh user
autostart=true
autorestart=true
priority=20
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:hotel]
command=/bin/bash /app/start-services.sh hotel
autostart=true
autorestart=true
priority=30
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:order]
command=/bin/bash /app/start-services.sh order
autostart=true
autorestart=true
priority=40
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:payment]
command=/bin/bash /app/start-services.sh payment
autostart=true
autorestart=true
priority=50
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:gateway]
command=/bin/bash /app/start-services.sh gateway
autostart=true
autorestart=true
priority=60
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
